<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신청 항목 추가 | 동아리 통합 인프라</title>
  <link rel="icon" href="/neoul-logo.png">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>

  <main class="feature-page">

    <a href="/budget.html" class="back-link">← 예산 신청으로 돌아가기</a>

    <header class="feature-header">
      <h1>신청 항목 추가</h1>
      <p>물품 한 개의 정보를 입력하고 저장하면 신청서의 '신청 현황'에 담깁니다.</p>
    </header>

    <section class="feature-content">

      <form id="itemForm" class="budget-form request-item-form">

        <p id="itemDraftMessage" class="message budget-message" role="status" aria-live="polite"></p>

        <label for="itemName">
          신청 물품 이름
          <input id="itemName" name="itemName" type="text" placeholder="예: 무선 마이크" required>
        </label>

        <label for="itemPurpose">
          사용 목적
          <input id="itemPurpose" name="purpose" type="text" placeholder="예: 정기 공연 음향" required>
        </label>

        <label for="itemAmount">
          신청 금액
          <input
            id="itemAmount"
            name="amount"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            placeholder="배송비 포함 금액을 입력하세요"
            required
          >
        </label>

        <label for="itemLink">
          구매 링크
          <input
            id="itemLink"
            name="purchaseLink"
            type="url"
            inputmode="url"
            placeholder="https://..."
            pattern="https?://.+"
            required
          >
        </label>

        <p class="budget-password-hint">
          http:// 또는 https:// 로 시작하는 주소만 입력할 수 있습니다.
        </p>

        <label for="itemDescription">
          상세 설명
          <textarea
            id="itemDescription"
            name="description"
            placeholder="이 물품이 필요한 이유와 사용 계획을 자세히 적어주세요."
            required
          ></textarea>
        </label>

        <div class="request-item-actions">
          <a href="/budget.html" class="secondary request-item-cancel">취소</a>
          <button id="itemSaveButton" type="submit">저장</button>
        </div>

        <p id="itemFormMessage" class="message budget-message" role="status" aria-live="polite"></p>

      </form>

    </section>

  </main>

  <script type="module" src="/src/budget/requestItem.js"></script>

</body>

</html>
