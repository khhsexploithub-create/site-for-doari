name: Deploy Firestore rules

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.firestore.json
      - .github/workflows/firebase-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SITE_FOR_DONGARI }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Firestore security rules
        run: npx --yes firebase-tools deploy --only firestore:rules --project site-for-dongari --config firebase.firestore.json --non-interactive
