<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>알림 메시지 | 동아리 통합 인프라</title>
  <script>addEventListener("pagereveal", function (e) { if (e.viewTransition) document.documentElement.classList.add("nu-vt"); });</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
  <link rel="icon" href="/neoul-logo.png">
  <link rel="stylesheet" href="/src/styles/site.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f5f4fb">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="너울">
  <script type="module" src="/src/pwa.js"></script>
</head>

<body class="nu">
  <main class="nu-wrap feature-page notices-page nu-enter">
    <header class="nu-pagehead">
      <img class="nu-pagehead-wave" src="/neoul-wave.png" alt="" aria-hidden="true">
      <a href="/" class="nu-back" aria-label="홈으로">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <p class="nu-crumb"><a href="/">홈</a> › 알림 메시지</p>
      <h1>알림 메시지</h1>
      <p class="nu-pagehead-desc">공지 · 연합회 행사 · 내 신청 처리 결과를 모아 봐요.</p>

      <!-- 푸시 알림 켜기 (로그인한 사람만 보인다) -->
      <section class="push-panel" id="pushPanel" hidden>
        <p class="push-panel-text" id="pushPanelText"></p>
        <button type="button" id="pushToggleButton" hidden></button>
      </section>
    </header>

    <div class="notices-layout">

      <section class="notices-listcard" aria-label="알림 목록">
        <div class="notices-tabs" role="tablist" aria-label="알림 종류">
          <button type="button" class="notices-tab is-active" role="tab" aria-selected="true" data-tab="received">
            받은 메시지<span class="notices-tab-dot" id="receivedTabDot" hidden>•</span>
          </button>
          <button type="button" class="notices-tab" role="tab" aria-selected="false" data-tab="unread">
            새 알림<span class="notices-tab-dot" id="unreadTabDot" hidden>•</span>
          </button>
        </div>

        <div class="notices-toolbar">
          <div class="notices-filters">
            <label class="notices-checkbox">
              <input type="checkbox" id="noticeFilterApp" checked>
              <span>공지</span>
            </label>
            <label class="notices-checkbox">
              <input type="checkbox" id="noticeFilterEvent" checked>
              <span>행사</span>
            </label>
            <select id="noticeCategoryFilter" aria-label="분류 선택">
              <option value="">분류 전체</option>
              <option value="general">일반</option>
              <option value="event">행사</option>
              <option value="urgent">긴급</option>
            </select>
            <select id="noticeSortSelect" aria-label="정렬 방식"></select>
          </div>

          <input type="search" id="noticeSearchInput" class="notices-search-input" placeholder="검색어를 입력하세요" aria-label="공지 검색">

          <div class="notices-countrow">
            <span class="notices-count">전체 <b id="noticeTotalCount">0</b>건</span>
            <button type="button" id="markAllReadButton" class="notices-markall">모두 읽음 처리</button>
          </div>
        </div>

        <ul id="noticeList" class="notice-list" aria-live="polite">
          <li class="notice-list-empty">공지를 불러오는 중...</li>
        </ul>
      </section>

      <section class="notice-detail" id="noticeDetail" aria-live="polite">
        <div class="notice-detail-placeholder" id="noticeDetailPlaceholder">
          <span class="notice-detail-placeholder-icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
          </span>
          <p>메시지를 고르면 여기에 보여요.</p>
        </div>

        <article class="notice-detail-body" id="noticeDetailBody" hidden>
          <header class="notice-detail-head">
            <span id="noticeDetailBadge" class="notice-item-badge"></span>
            <h2 id="noticeDetailTitle"></h2>
            <div class="notice-detail-meta">
              <span id="noticeDetailAuthor"></span>
              <span id="noticeDetailDate"></span>
            </div>
          </header>

          <p class="notice-detail-content" id="noticeDetailContent"></p>

          <div class="notice-detail-actions admin-card-actions" id="noticeDetailActions" hidden>
            <button type="button" id="noticeEditButton" class="secondary">수정</button>
            <button type="button" id="noticeDeleteButton" class="danger">삭제</button>
          </div>
        </article>
      </section>

    </div>

    <!-- 작성 (관리자 · 공지 권한을 받은 소위원장 전용) -->
    <section class="notice-write-section" id="noticeWriteSection" hidden>
      <div class="resources-section-heading">
        <h2>공지 작성</h2>
        <p>관리자와, 관리자가 공지 권한을 준 소위원장만 작성할 수 있습니다.</p>
      </div>

      <form id="noticeForm" class="schedule-form notice-form" novalidate>
        <input type="hidden" id="noticeEditingId" value="">

        <div class="schedule-form-grid">
          <label for="noticeTitle">제목
            <input id="noticeTitle" type="text" placeholder="예: 스쿨점퍼 신청 안내" required>
          </label>
          <label for="noticeCategory">분류
            <select id="noticeCategory">
              <option value="general">일반</option>
              <option value="event">행사</option>
              <option value="urgent">긴급</option>
            </select>
          </label>
        </div>

        <label for="noticeContent">내용
          <textarea id="noticeContent" placeholder="공지 내용을 입력하세요." required></textarea>
        </label>

        <div class="union-event-form-actions">
          <button id="noticeSubmitButton" type="submit">공지 등록</button>
          <button id="noticeCancelEditButton" type="button" class="secondary" hidden>수정 취소</button>
        </div>

        <p id="noticeFormMessage" class="message calendar-message" role="status" aria-live="polite"></p>
      </form>
    </section>

  </main>

  <script type="module" src="/src/notices/notices.js"></script>
</body>

</html>
